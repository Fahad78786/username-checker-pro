<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UserChecker Pro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f7fb;
      color: #1e1e2f;
      min-height: 100vh;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(90deg, #7c3aed, #db2777);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .points-badge {
      background: #ede9fe;
      border: 1px solid #7c3aed;
      color: #7c3aed;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid #d1d5db;
      color: #6b7280;
      padding: 5px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .logout-btn:hover {
      color: #1e1e2f;
      border-color: #9ca3af;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #1e1e2f;
    }
    .subtitle {
      color: #6b7280;
      font-size: 15px;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #1e1e2f;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title .badge {
      font-size: 11px;
      background: #ede9fe;
      color: #7c3aed;
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    label {
      font-size: 13px;
      color: #4b5563;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      color: #1e1e2f;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      font-family: 'Consolas', monospace;
    }
    input:focus,
    textarea:focus {
      border-color: #7c3aed;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #7c3aed, #db2777);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 12px;
    }
    .btn:hover {
      opacity: 0.88;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #1e1e2f;
    }
    .btn-secondary:hover {
      background: #d1d5db;
    }
    .result-box {
      margin-top: 16px;
      padding: 16px;
      background: #f9fafb;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      display: none;
      max-height: 400px;
      overflow-y: auto;
    }
    .result-box.show {
      display: block;
    }
    .result-item {
      padding: 8px 12px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .result-item:last-child {
      border-bottom: none;
    }
    .result-item .username {
      font-weight: 600;
      color: #1e1e2f;
    }
    .result-item .status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-available {
      background: #dcfce7;
      color: #16a34a;
    }
    .status-taken {
      background: #fee2e2;
      color: #dc2626;
    }
    .status-error {
      background: #fef3c7;
      color: #d97706;
    }
    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .stat {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 12px;
      flex: 1;
      min-width: 80px;
      text-align: center;
      color: #4b5563;
    }
    .stat strong {
      display: block;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .stat.green strong {
      color: #16a34a;
    }
    .stat.purple strong {
      color: #7c3aed;
    }
    .stat.blue strong {
      color: #2563eb;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #6b7280;
    }
    .loading .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid #e5e7eb;
      border-top: 3px solid #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    .error-box {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      padding: 12px 16px;
      color: #dc2626;
      font-size: 14px;
      margin-bottom: 12px;
      display: none;
    }
    .error-box.show {
      display: block;
    }
    .tab-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      padding: 8px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: #6b7280;
      transition: all 0.2s;
    }
    .tab-btn.active {
      border-color: #7c3aed;
      color: #7c3aed;
      background: #ede9fe;
    }
    .tab-btn:hover {
      border-color: #7c3aed;
      color: #7c3aed;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .detail-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 13px;
      border-bottom: 1px solid #f3f4f6;
    }
    .detail-item .label {
      color: #6b7280;
    }
    .detail-item .value {
      font-weight: 600;
      color: #1e1e2f;
    }
    .profile-pic {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #e5e7eb;
    }
    .verified-badge {
      color: #2563eb;
      font-size: 16px;
    }
    .private-badge {
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🔍 UserChecker Pro</div>
    <div class="user-info">
      <span id="usernameDisplay" style="color:#4b5563;font-size:14px;"></span>
      <span class="points-badge">💎 <span id="pointsDisplay">0</span> Points</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>
  <main>
    <h1>🔍 Instagram & Threads Checker</h1>
    <p class="subtitle">Check Instagram and Threads usernames with proxy support. 1 point per check.</p>

    <div class="error-box" id="errorBox"></div>

    <div class="grid">
      <!-- ✅ Instagram Checker -->
      <div class="card">
        <div class="card-title">📸 Instagram <span class="badge">1 point</span></div>

        <div class="tab-buttons">
          <button class="tab-btn active" data-tab="ig-single" onclick="switchTab('ig-single')">Single</button>
          <button class="tab-btn" data-tab="ig-bulk" onclick="switchTab('ig-bulk')">Bulk</button>
        </div>

        <!-- Single Check -->
        <div class="tab-content active" id="ig-single">
          <label>Enter Instagram username</label>
          <input type="text" id="igUsername" placeholder="e.g., zuck" />
          <button class="btn" onclick="checkInstagram()" id="igBtn">🔍 Check</button>
        </div>

        <!-- Bulk Check -->
        <div class="tab-content" id="ig-bulk">
          <label>Enter usernames (one per line)</label>
          <textarea id="igBulkUsernames" placeholder="zuck&#10;elonmusk&#10;cristiano"></textarea>
          <button class="btn" onclick="checkInstagramBulk()" id="igBulkBtn">🔍 Check All</button>
        </div>

        <div id="igResult" class="result-box"></div>
      </div>

      <!-- ✅ Threads Checker -->
      <div class="card">
        <div class="card-title">🧵 Threads <span class="badge">1 point</span></div>

        <div class="tab-buttons">
          <button class="tab-btn active" data-tab="th-single" onclick="switchTab('th-single')">Single</button>
          <button class="tab-btn" data-tab="th-bulk" onclick="switchTab('th-bulk')">Bulk</button>
        </div>

        <!-- Single Check -->
        <div class="tab-content active" id="th-single">
          <label>Enter Threads username</label>
          <input type="text" id="thUsername" placeholder="e.g., zuck" />
          <button class="btn" onclick="checkThreads()" id="thBtn">🔍 Check</button>
        </div>

        <!-- Bulk Check -->
        <div class="tab-content" id="th-bulk">
          <label>Enter usernames (one per line)</label>
          <textarea id="thBulkUsernames" placeholder="zuck&#10;elonmusk&#10;cristiano"></textarea>
          <button class="btn" onclick="checkThreadsBulk()" id="thBulkBtn">🔍 Check All</button>
        </div>

        <div id="thResult" class="result-box"></div>
      </div>
    </div>

    <!-- ✅ Recent Activity -->
    <div class="card" style="margin-top:20px;">
      <div class="card-title">📊 Recent Activity</div>
      <div id="activityLog" style="color:#6b7280;font-size:13px;">
        No recent activity
      </div>
    </div>
  </main>

  <script>
    // ✅ API Base URL
    const API_BASE_URL = 'https://username-checker-pro.onrender.com';

    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token) window.location.href = '/login';

    let currentPoints = user.points || 0;

    document.getElementById('usernameDisplay').textContent = '@' + (user.username || '');
    updatePoints(currentPoints);

    function updatePoints(pts) {
      currentPoints = pts;
      document.getElementById('pointsDisplay').textContent = pts;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = '⚠️ ' + msg;
      box.classList.add('show');
      setTimeout(() => box.classList.remove('show'), 5000);
    }

    function showLoading(btnId) {
      const btn = document.getElementById(btnId);
      btn.disabled = true;
      btn.textContent = '⏳ Checking...';
    }

    function hideLoading(btnId, text) {
      const btn = document.getElementById(btnId);
      btn.disabled = false;
      btn.textContent = text || '🔍 Check';
    }

    function displayResult(containerId, data) {
      const container = document.getElementById(containerId);
      container.classList.add('show');

      if (data.success && data.result && data.result.success) {
        const r = data.result;
        container.innerHTML = `
          <div class="stats-row">
            <div class="stat green"><strong>✅</strong> Available</div>
            <div class="stat purple"><strong>${r.followers || 0}</strong> Followers</div>
            <div class="stat blue"><strong>${r.following || 0}</strong> Following</div>
          </div>
          <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;">
            ${r.profile_pic ? `<img src="${r.profile_pic}" class="profile-pic" />` : ''}
            <div>
              <div style="font-weight:700;font-size:18px;">@${r.username}</div>
              <div style="color:#4b5563;">${r.full_name || 'No name'}</div>
              <div>
                ${r.is_verified ? '<span class="verified-badge">✓ Verified</span>' : ''}
                ${r.is_private ? '<span class="private-badge">🔒 Private</span>' : ''}
              </div>
              <div style="font-size:12px;color:#6b7280;margin-top:4px;">Method: ${r.method || 'N/A'}</div>
            </div>
          </div>
          <div style="font-size:12px;color:#6b7280;">
            Points remaining: ${data.remainingPoints}
          </div>
        `;
      } else if (data.success && data.results) {
        // Bulk results
        const available = data.results.filter(r => r.success);
        const taken = data.results.filter(r => !r.success);

        container.innerHTML = `
          <div class="stats-row">
            <div class="stat green"><strong>${available.length}</strong> Available</div>
            <div class="stat red"><strong>${taken.length}</strong> Taken</div>
            <div class="stat purple"><strong>${data.totalChecked}</strong> Checked</div>
          </div>
          ${available.length > 0 ? `
            <div style="margin-top:8px;font-weight:600;color:#16a34a;">✅ Available Usernames:</div>
            ${available.map(r => `<div class="result-item"><span class="username">@${r.username}</span><span class="status status-available">Available</span></div>`).join('')}
          ` : ''}
          ${taken.length > 0 ? `
            <div style="margin-top:8px;font-weight:600;color:#dc2626;">❌ Taken Usernames:</div>
            ${taken.map(r => `<div class="result-item"><span class="username">@${r.username}</span><span class="status status-taken">${r.status || 'Taken'}</span></div>`).join('')}
          ` : ''}
          <div style="font-size:12px;color:#6b7280;margin-top:12px;">
            Points remaining: ${data.remainingPoints}
          </div>
        `;
      } else {
        container.innerHTML = `
          <div style="color:#dc2626;font-weight:600;">❌ ${data.message || 'Not found or error'}</div>
        `;
      }

      updatePoints(data.remainingPoints);
      addActivity(data);
    }

    function addActivity(data) {
      const log = document.getElementById('activityLog');
      const time = new Date().toLocaleTimeString();
      const count = data.results ? data.results.length : 1;
      const available = data.results ? data.results.filter(r => r.success).length : (data.result?.success ? 1 : 0);
      log.innerHTML = `
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f3f4f6;">
          <span>${time} - Checked ${count} username(s)</span>
          <span style="color:#16a34a;">${available} available</span>
        </div>
        ${log.innerHTML}
      `;
    }

    // ✅ Instagram Single
    async function checkInstagram() {
      const username = document.getElementById('igUsername').value.trim();
      if (!username) { showError('Enter a username'); return; }

      showLoading('igBtn');
      try {
        const res = await fetch(`${API_BASE_URL}/api/instagram/check`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ username })
        });
        const data = await res.json();
        displayResult('igResult', data);
      } catch (e) {
        showError('Network error: ' + e.message);
      }
      hideLoading('igBtn');
    }

    // ✅ Instagram Bulk
    async function checkInstagramBulk() {
      const text = document.getElementById('igBulkUsernames').value;
      const usernames = text.split('\n').map(u => u.trim()).filter(u => u.length > 0);
      if (usernames.length === 0) { showError('Enter at least one username'); return; }
      if (usernames.length > 20) { showError('Maximum 20 usernames per request'); return; }

      showLoading('igBulkBtn');
      try {
        const res = await fetch(`${API_BASE_URL}/api/instagram/bulk`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ usernames })
        });
        const data = await res.json();
        displayResult('igResult', data);
      } catch (e) {
        showError('Network error: ' + e.message);
      }
      hideLoading('igBulkBtn', '🔍 Check All');
    }

    // ✅ Threads Single
    async function checkThreads() {
      const username = document.getElementById('thUsername').value.trim();
      if (!username) { showError('Enter a username'); return; }

      showLoading('thBtn');
      try {
        const res = await fetch(`${API_BASE_URL}/api/check/bulk`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ usernames: [username], platforms: ['threads'] })
        });
        const data = await res.json();
        const container = document.getElementById('thResult');
        container.classList.add('show');

        if (data.success && data.results && data.results.length > 0) {
          const r = data.results[0];
          const status = r.threads;
          const name = r.threads_name;

          if (status === 'active') {
            container.innerHTML = `
              <div class="stats-row">
                <div class="stat green"><strong>✅</strong> Available</div>
                <div class="stat purple"><strong>${name || 'No name'}</strong></div>
              </div>
              <div style="font-weight:700;font-size:18px;">@${r.username}</div>
              <div style="font-size:12px;color:#6b7280;margin-top:8px;">Points remaining: ${data.remainingPoints}</div>
            `;
          } else if (status === 'available') {
            container.innerHTML = `
              <div class="stats-row">
                <div class="stat green"><strong>✅</strong> Available</div>
              </div>
              <div style="font-weight:700;font-size:18px;">@${r.username} is available!</div>
              <div style="font-size:12px;color:#6b7280;margin-top:8px;">Points remaining: ${data.remainingPoints}</div>
            `;
          } else {
            container.innerHTML = `
              <div style="color:#dc2626;font-weight:600;">❌ @${r.username} - ${status || 'Not available'}</div>
              <div style="font-size:12px;color:#6b7280;margin-top:8px;">Points remaining: ${data.remainingPoints}</div>
            `;
          }
          updatePoints(data.remainingPoints);
          addActivity(data);
        } else {
          container.innerHTML = `<div style="color:#dc2626;">❌ ${data.message || 'Error checking username'}</div>`;
        }
      } catch (e) {
        showError('Network error: ' + e.message);
      }
      hideLoading('thBtn');
    }

    // ✅ Threads Bulk
    async function checkThreadsBulk() {
      const text = document.getElementById('thBulkUsernames').value;
      const usernames = text.split('\n').map(u => u.trim()).filter(u => u.length > 0);
      if (usernames.length === 0) { s
